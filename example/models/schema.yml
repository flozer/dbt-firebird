version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
  - name: customers
    description: "Perfil consolidado de clientes com pedidos agregados"
    columns:
      - name: customer_id
        description: "Chave do cliente na tabela de origem"
        tests:
          - unique
          - not_null
  - name: order_summary
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
